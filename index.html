<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PikoChat - Trò Chuyện Cùng Linh Vật</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      :root {
        --primary-bg: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        --card-bg: rgba(255, 255, 255, 0.88);
        --accent-color: #6c5ce7;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--primary-bg);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* 3 LINH VẬT ĐI DẠO & TƯƠNG TÁC MÀN HÌNH */
      #running-mascots {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9999;
        overflow: hidden;
      }

      .mascot-wrapper {
        position: absolute;
        width: 120px;
        pointer-events: auto;
        cursor: grab;
        transition: transform 0.3s ease;
      }

      .mascot-wrapper:hover {
        transform: scale(1.15) !important;
      }

      .run-mascot {
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0px 8px 15px rgba(0, 0, 0, 0.2));
      }

      /* BÓNG THOẠI HỘI THOẠI */
      .mascot-bubble {
        position: absolute;
        top: -45px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffffff;
        color: #2d3436;
        padding: 6px 14px;
        border-radius: 18px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        opacity: 0;
        transition:
          opacity 0.4s ease,
          transform 0.3s ease;
        pointer-events: none;
        z-index: 10;
        border: 2px solid #6c5ce7;
      }

      .mascot-bubble::after {
        content: "";
        position: absolute;
        bottom: -7px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 7px 7px 0;
        border-style: solid;
        border-color: #6c5ce7 transparent transparent transparent;
      }

      .mascot-wrapper.speaking .mascot-bubble {
        opacity: 1;
        transform: translateX(-50%) translateY(-5px);
      }

      /* QUY ĐẠO DI CHUYỂN CỦA 3 LINH VẬT */
      .mascot-1 {
        animation: walkAround1 28s ease-in-out infinite alternate;
      }
      .mascot-2 {
        animation: walkAround2 34s ease-in-out infinite alternate;
      }
      .mascot-3 {
        animation: walkAround3 30s ease-in-out infinite alternate;
      }

      @keyframes walkAround1 {
        0% {
          top: 10%;
          left: 5%;
          transform: scaleX(1);
        }
        25% {
          top: 75%;
          left: 80%;
          transform: scaleX(1);
        }
        50% {
          top: 80%;
          left: 15%;
          transform: scaleX(-1);
        }
        75% {
          top: 20%;
          left: 70%;
          transform: scaleX(-1);
        }
        100% {
          top: 10%;
          left: 5%;
          transform: scaleX(1);
        }
      }

      @keyframes walkAround2 {
        0% {
          top: 15%;
          left: 85%;
          transform: scaleX(-1);
        }
        30% {
          top: 70%;
          left: 10%;
          transform: scaleX(-1);
        }
        60% {
          top: 35%;
          left: 50%;
          transform: scaleX(1);
        }
        85% {
          top: 80%;
          left: 75%;
          transform: scaleX(1);
        }
        100% {
          top: 15%;
          left: 85%;
          transform: scaleX(-1);
        }
      }

      @keyframes walkAround3 {
        0% {
          top: 70%;
          left: 45%;
          transform: scaleX(1);
        }
        33% {
          top: 12%;
          left: 35%;
          transform: scaleX(1);
        }
        66% {
          top: 82%;
          left: 85%;
          transform: scaleX(-1);
        }
        100% {
          top: 70%;
          left: 45%;
          transform: scaleX(1);
        }
      }

      /* MÀN HÌNH CHÍNH */
      .screen {
        display: none;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .screen.active {
        display: flex;
      }

      .auth-container,
      .select-container,
      .chat-container {
        background: var(--card-bg);
        backdrop-filter: blur(15px);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.5);
        overflow: hidden;
      }

      .auth-container {
        display: flex;
        max-width: 850px;
        width: 100%;
      }
      .auth-banner {
        background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        color: white;
        padding: 40px;
        width: 40%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .auth-banner img {
        width: 140px;
        filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.15));
        margin-bottom: 15px;
      }
      .auth-form-box {
        padding: 50px 40px;
        width: 60%;
      }

      .select-container {
        max-width: 900px;
        width: 100%;
        padding: 40px;
        text-align: center;
      }
      .character-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin: 30px 0;
      }
      .char-card {
        background: white;
        padding: 20px;
        border-radius: 20px;
        border: 3px solid transparent;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      }
      .char-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 25px rgba(108, 92, 231, 0.2);
      }
      .char-card.selected {
        border-color: var(--accent-color);
        background: #f0edff;
      }
      .char-card img {
        width: 110px;
        height: 110px;
        object-fit: contain;
      }

      .btn-submit {
        background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 12px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
      }
      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
      }

      .btn-game-nav {
        background: linear-gradient(135deg, #00b894, #55efc4) !important;
        color: white !important;
        margin-top: 15px;
        display: inline-block;
        text-align: center;
        text-decoration: none;
      }

      /* KHUNG CHAT */
      .chat-container {
        width: 950px;
        height: 600px;
        display: flex;
      }
      .sidebar {
        width: 250px;
        background: #2d3436;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #f8f9fa;
      }
      .chat-box {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
      }
      .chat-input-area {
        display: flex;
        padding: 15px;
        background: white;
        border-top: 1px solid #eee;
        gap: 10px;
      }
      .chat-input-area input {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid #eee;
        border-radius: 25px;
        outline: none;
      }
      .chat-input-area button {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 0 25px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
      }

      .input-group {
        margin-bottom: 20px;
        text-align: left;
      }
      .input-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #636e72;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #dfe6e9;
        border-radius: 10px;
        outline: none;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <!-- 3 LINH VẬT ĐI DẠO & TỰ TƯƠNG TÁC -->
    <div id="running-mascots">
      <!-- Mascot 1: Cợt Nhã -->
      <div id="m1" class="mascot-wrapper mascot-1">
        <div class="mascot-bubble" id="b1">Alo anh em!</div>
        <img
          src="images/mascot-funny.png"
          class="run-mascot"
          onerror="
            this.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=Funny'
          "
        />
      </div>

      <!-- Mascot 2: Cọc Cằn -->
      <div id="m2" class="mascot-wrapper mascot-2">
        <div class="mascot-bubble" id="b2">Nhìn gì mà nhìn!</div>
        <img
          src="images/mascot-angry.png"
          class="run-mascot"
          onerror="
            this.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=Angry'
          "
        />
      </div>

      <!-- Mascot 3: Dễ Thương -->
      <div id="m3" class="mascot-wrapper mascot-3">
        <div class="mascot-bubble" id="b3">Mọi người ơi~</div>
        <img
          src="images/mascot-cute.jpg"
          class="run-mascot"
          onerror="
            this.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=Cute'
          "
        />
      </div>
    </div>

    <!-- MÀN HÌNH 1: ĐĂNG NHẬP -->
    <div id="auth-screen" class="screen active">
      <div class="auth-container">
        <div class="auth-banner">
          <img
            src="images/mascot-main.png"
            alt="PikoChat"
            onerror="
              this.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=PikoMain'
            "
          />
          <h1>PikoChat</h1>
          <p>Tương tác vui vẻ cùng dàn linh vật Piko!</p>
        </div>
        <div class="auth-form-box">
          <h2 style="color: #2d3436; margin-bottom: 25px">Đăng Nhập</h2>
          <form onsubmit="handleAuth(event)">
            <div class="input-group">
              <label>Tên tài khoản</label>
              <input
                type="text"
                id="username"
                required
                placeholder="Nhập admin"
              />
            </div>
            <div class="input-group">
              <label>Mật khẩu</label>
              <input
                type="password"
                id="password"
                required
                placeholder="Nhập 123456"
              />
            </div>
            <button type="submit" class="btn-submit" style="width: 100%">
              Đăng Nhập
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- MÀN HÌNH 2: CHỌN LINH VẬT -->
    <div id="select-screen" class="screen">
      <div class="select-container">
        <h2 style="color: #2d3436; font-size: 28px">
          Chọn Linh Vật Trò Chuyện
        </h2>
        <p style="color: #636e72">
          Có thể chọn 1 hoặc nhiều linh vật cùng lúc nha!
        </p>

        <div class="character-grid">
          <div
            class="char-card"
            data-id="cot-nha"
            onclick="toggleSelectChar(this)"
          >
            <img
              src="images/mascot-funny.png"
              onerror="
                this.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=Funny'
              "
            />
            <h3 style="color: #28a745; margin-top: 10px">Piko Cợt Nhã</h3>
          </div>
          <div
            class="char-card"
            data-id="coc-can"
            onclick="toggleSelectChar(this)"
          >
            <img
              src="images/mascot-angry.png"
              onerror="
                this.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=Angry'
              "
            />
            <h3 style="color: #dc3545; margin-top: 10px">Piko Cọc Cằn</h3>
          </div>
          <div
            class="char-card"
            data-id="de-thuong"
            onclick="toggleSelectChar(this)"
          >
            <img
              src="images/mascot-cute.jpg"
              onerror="
                this.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=Cute'
              "
            />
            <h3 style="color: #e83e8c; margin-top: 10px">Piko Dễ Thương</h3>
          </div>
        </div>

        <button class="btn-submit" onclick="startChat()">
          Bắt Đầu Trò Chuyện
        </button>
        <a href="game.html" class="btn-submit btn-game-nav"
          >🎮 Sang Trang Chơi Game</a
        >
      </div>
    </div>

    <!-- MÀN HÌNH 3: CHAT -->
    <div id="chat-screen" class="screen">
      <div class="chat-container">
        <div class="sidebar">
          <h3 style="color: white; margin-bottom: 20px" id="display-username">
            User
          </h3>
          <button
            class="btn-submit"
            style="background: #fdcb6e; color: #2d3436"
            onclick="showScreen('select-screen')"
          >
            Đổi Linh Vật
          </button>
          <a href="game.html" class="btn-submit btn-game-nav">Chơi Game</a>
          <button
            class="btn-submit"
            style="background: #ff7675; margin-top: auto"
            onclick="logout()"
          >
            Đăng xuất
          </button>
        </div>
        <div class="chat-main">
          <div class="chat-box" id="chat-box"></div>
          <form class="chat-input-area" onsubmit="sendMessage(event)">
            <input
              type="text"
              id="user-input"
              required
              placeholder="Nhập tin nhắn..."
              autocomplete="off"
            />
            <button type="submit">Gửi</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      // 1. BỘ TÁCH NỀN THÔNG MINH BẰNG HTML5 CANVAS (FLOOD FILL)
      function removeMascotBackground(imgElement) {
        if (!imgElement.complete || imgElement.naturalWidth === 0) {
          imgElement.onload = () => removeMascotBackground(imgElement);
          return;
        }

        try {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          const width = imgElement.naturalWidth;
          const height = imgElement.naturalHeight;
          canvas.width = width;
          canvas.height = height;

          ctx.drawImage(imgElement, 0, 0);
          const imageData = ctx.getImageData(0, 0, width, height);
          const data = imageData.data;

          const visited = new Uint8Array(width * height);
          const queue = [];

          // Khởi tạo hàng đợi từ 4 góc ảnh
          const corners = [
            [0, 0],
            [width - 1, 0],
            [0, height - 1],
            [width - 1, height - 1],
          ];

          corners.forEach(([x, y]) => {
            const idx = y * width + x;
            queue.push(idx);
            visited[idx] = 1;
          });

          // Hàm kiểm tra màu nền sáng/trắng/xám
          function isBgPixel(idx) {
            const p = idx * 4;
            const r = data[p],
              g = data[p + 1],
              b = data[p + 2];
            return r > 185 && g > 185 && b > 185; // Ngưỡng nhận diện màu nền xám/trắng
          }

          // Thuật toán Loang từ 4 góc vào để xóa nền
          while (queue.length > 0) {
            const curr = queue.pop();
            if (isBgPixel(curr)) {
              data[curr * 4 + 3] = 0; // Đặt Alpha = 0 (xóa nền)

              const cx = curr % width;
              const cy = Math.floor(curr / width);

              const neighbors = [];
              if (cx > 0) neighbors.push(curr - 1);
              if (cx < width - 1) neighbors.push(curr + 1);
              if (cy > 0) neighbors.push(curr - width);
              if (cy < height - 1) neighbors.push(curr + width);

              for (let n of neighbors) {
                if (!visited[n]) {
                  visited[n] = 1;
                  queue.push(n);
                }
              }
            }
          }

          ctx.putImageData(imageData, 0, 0);
          imgElement.src = canvas.toDataURL("image/png");
        } catch (e) {
          console.warn("Tự động tách nền thất bại:", e);
        }
      }

      function processAllMascotImages() {
        const images = document.querySelectorAll(
          ".run-mascot, .char-card img, .auth-banner img",
        );
        images.forEach((img) => removeMascotBackground(img));
      }

      // 2. HỆ THỐNG TRÒ CHUYỆN TỰ ĐỘNG GIỮA 3 LINH VẬT TRÊN MÀN HÌNH
      const DIALOGUES = [
        [
          { id: "m1", text: "Này Cọc Cằn, đi uống trà sữa hông? 🧋" },
          { id: "m2", text: "Biến đi! Đang bực mình đây! 😡" },
          { id: "m3", text: "Hai cậu đừng cãi nhau nữa mà~ 🥰" },
        ],
        [
          { id: "m1", text: "Lêu lêu! Đố bắt được tui đó! 😜" },
          { id: "m2", text: "Đứng lại đó cho tui! 🔥" },
          { id: "m3", text: "Coi chừng té đó hai cậu ơi! 🥺" },
        ],
        [
          { id: "m3", text: "Hôm nay trời đẹp quá nè! 🌸" },
          { id: "m1", text: "Đẹp trời để đi quậy đó! 🥳" },
          { id: "m2", text: "Nắng muốn cháy da luôn ở đó đẹp! 🙄" },
        ],
      ];

      function startMascotConversations() {
        setInterval(() => {
          const conversation =
            DIALOGUES[Math.floor(Math.random() * DIALOGUES.length)];

          conversation.forEach((item, index) => {
            setTimeout(() => {
              const wrapper = document.getElementById(item.id);
              const bubble = wrapper.querySelector(".mascot-bubble");
              bubble.innerText = item.text;
              wrapper.classList.add("speaking");

              setTimeout(() => {
                wrapper.classList.remove("speaking");
              }, 3000);
            }, index * 1200);
          });
        }, 8000);
      }

      // 3. ĐIỀU HƯỚNG MÀN HÌNH & XỬ LÝ SỰ KIỆN
      function showScreen(screenId) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(screenId).classList.add("active");
      }

      function handleAuth(e) {
        e.preventDefault();
        const u = document.getElementById("username").value.trim();
        const p = document.getElementById("password").value.trim();
        if (u === "admin" && p === "123456") {
          document.getElementById("display-username").innerText = "Chào, " + u;
          showScreen("select-screen");
        } else {
          alert("Sai tài khoản hoặc mật khẩu!");
        }
      }

      function toggleSelectChar(card) {
        card.classList.toggle("selected");
      }

      // 4. DỮ LIỆU TỪ KHÓA TRẢ LỜI CHAT ĐÃ MỞ RỘNG ĐẦY ĐỦ
      const BOTS = {
        "cot-nha": {
          name: "Piko Cợt Nhã",
          color: "#28a745",
          rules: [
            {
              keywords: ["chào", "hi", "hello", "alo", "hey"],
              answers: [
                "Hí anh em! Nay gió đâu thổi quý khách ghé qua đây vậy? 🤪",
                "Chàooo! Lại tìm trùm tấu hài để giải xui đúng hông? 😂",
                "Alo alo 1 2 3 4, Piko Cợt Nhã nghe đâyyy! 🎤",
              ],
            },
            {
              keywords: ["ăn", "đói", "cơm", "đồ ăn", "thèm"],
              answers: [
                "Ăn gì cũng được nhưng ai trả tiền mới là vấn đề! 💸",
                "Đói quá thì tự lăn vô bếp chứ tui chỉ biết ăn chực thôi 🍲",
                "Nói tới ăn là sáng mắt lên liền, bao tui dĩa cơm tấm đi! 🥩",
              ],
            },
            {
              keywords: ["uống", "trà sữa", "cà phê", "nước"],
              answers: [
                "1 ly trà sữa 100% đường 200% trân châu cảm ơn nha! 🧋",
                "Uống cà phê cho tỉnh để còn tấu hài tiếp nè ☕",
                "Mùa này làm ly dừa dầm đá xay là đúng bài luôn! 🥥",
              ],
            },
            {
              keywords: ["quạo", "tức", "gắt", "chửi", "bực"],
              answers: [
                "Ủa sao quạo? Bình tĩnh uống ngụm nước rồi xỉa xói tiếp nè 🤣",
                "Ai làm gì mà máu dồn lên não dữ vậy bro? 🩺",
                "Gắt quá gắt quá, quạo là mau già lắm đó nha! 👴",
              ],
            },
            {
              keywords: ["tâm trạng", "buồn", "vui", "chán", "suy", "khóc"],
              answers: [
                "Buồn làm gì cho đời nó chán, đời có mấy lăm đâu mà héo hon! 🥳",
                "Suy ít thôi, suy nhiều tóc bạc rồi ai thèm hốt 😜",
                "Vui lên! Tui kể chuyện cười cho nghe nè: 'Có một con mèo... hết chuyện' 😂",
              ],
            },
            {
              keywords: ["sức khoẻ", "mệt", "bệnh", "ốm", "đầu", "ngủ"],

      // 5. XỬ LÝ NHẬN VÀ PHẢN HỒI TIN NHẮN
      function getBotReply(botId, text) {
        const bot = BOTS[botId];
        if (!bot) return "...";
        const lowerText = text.toLowerCase();

        if (bot.rules) {
          for (let rule of bot.rules) {
            if (rule.keywords.some((kw) => lowerText.includes(kw))) {
              return rule.answers[
                Math.floor(Math.random() * rule.answers.length)
              ];
            }
          }
        }
        return bot.defaultResponses[
          Math.floor(Math.random() * bot.defaultResponses.length)
        ];
      }

      let selectedBotIds = [];

      function startChat() {
        const selected = document.querySelectorAll(".char-card.selected");
        if (selected.length === 0) return alert("Hãy chọn ít nhất 1 linh vật!");
        selectedBotIds = Array.from(selected).map((c) =>
          c.getAttribute("data-id"),
        );
        document.getElementById("chat-box").innerHTML =
          '<div style="text-align: center; color: #888; padding: 10px;">Bắt đầu trò chuyện!</div>';
        showScreen("chat-screen");
      }

      function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById("user-input");
        const text = input.value.trim();
        if (!text) return;

        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML += `<div style="margin: 10px 0; text-align: right;"><span style="background: #6c5ce7; color: white; padding: 10px 18px; border-radius: 18px; display: inline-block;">${text}</span></div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        selectedBotIds.forEach((botId) => {
          const bot = BOTS[botId];
          const reply = getBotReply(botId, text);

          setTimeout(() => {
            chatBox.innerHTML += `<div style="margin: 10px 0; text-align: left;"><span style="color: ${bot.color}; font-weight: bold;">${bot.name}</span><br><span style="background: #ffffff; color: #333; padding: 10px 18px; border-radius: 18px; display: inline-block; margin-top: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">${reply}</span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
          }, 500);
        });
      }

      function logout() {
        document
          .querySelectorAll(".char-card")
          .forEach((c) => c.classList.remove("selected"));
        showScreen("auth-screen");
      }
